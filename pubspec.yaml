name: flutter_modern_template
description: "🚀 Android-focused Flutter template with Material 3, rich Dart code, and modern architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  intl: ^0.19.0
  table_calendar: ^3.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

# Platform-specific configuration
platforms:
  android:
    default_package: flutter_modern_template
